<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>抉择硬币</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    overflow: hidden;
    --ink: #3d3222; --sub: #8a7a5f;
    --glass: rgba(255,255,255,.55); --glass-line: rgba(255,255,255,.65);
    --btn1: #f2b23e; --btn2: #d97a1a;
  }
  body.night {
    --ink: #f0ead8; --sub: #aab4d8;
    --glass: rgba(16,24,54,.55); --glass-line: rgba(255,255,255,.14);
  }

  /* ================= 动态天空/太空背景 ================= */
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  body.day #sky     { background: linear-gradient(180deg,#5aa7e8 0%,#a8d4f5 55%,#eaf5ff 100%); }
  body.day.cloudy   #sky { background: linear-gradient(180deg,#7f9fc0 0%,#b8cbe0 60%,#e8eef5 100%); }
  body.day.overcast #sky { background: linear-gradient(180deg,#66707d 0%,#8f9aa6 55%,#c3cbd4 100%); }
  body.night #sky   { background: linear-gradient(180deg,#0b1030 0%,#1b2450 50%,#33407a 100%); }

  #sky .sun {
    position: absolute; top: 7%; right: 10%; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle,#fff8cf 25%,#ffd54a 60%,rgba(255,213,74,0) 78%);
    box-shadow: 0 0 80px 30px rgba(255,225,120,.55);
    animation: sunPulse 6s ease-in-out infinite;
  }
  @keyframes sunPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  #sky .cloud { position: absolute; background: rgba(255,255,255,.92); border-radius: 999px; filter: blur(1px); animation: drift linear infinite; }
  #sky .cloud::before, #sky .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
  #sky .cloud::before { width:58%; height:165%; left:13%; top:-75%; }
  #sky .cloud::after  { width:44%; height:130%; right:15%; top:-52%; }
  body.overcast .cloud { background: rgba(226,230,235,.85); }
  @keyframes drift { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
  #sky .star { position: absolute; width: 2.5px; height: 2.5px; background:#fff; border-radius:50%; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:1} }
  #sky .moon {
    position: absolute; top: 6%; right: 9%; width: 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fdfbf3 55%, #d9d4c4 100%);
    box-shadow: 0 0 60px 18px rgba(255,255,240,.3); animation: floatY 9s ease-in-out infinite;
  }
  #sky .planet { position: absolute; opacity: .85; animation: floatY ease-in-out infinite; }
  #sky .satellite { position: absolute; animation: crossSky linear infinite; }
  @keyframes crossSky { from { transform: translateX(-12vw) } to { transform: translateX(112vw) } }
  /* 流星：自上而下坠落（右上 → 左下） */
  #sky .meteor {
    position: absolute; width: 130px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
    transform: rotate(143deg); opacity: 0;
    animation: meteorFall 7s ease-out infinite;
  }
  @keyframes meteorFall {
    0%   { transform: rotate(143deg) translateX(0);    opacity: 0; }
    4%   { opacity: .95; }
    16%  { transform: rotate(143deg) translateX(52vw); opacity: 0; }
    100% { transform: rotate(143deg) translateX(52vw); opacity: 0; }
  }
  @keyframes floatY { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-14px) } }

  /* ================= 页面结构 ================= */
  .screen {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity .5s ease;
    padding: 24px;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  /* ---------- 第一页 ---------- */
  #screen1 { justify-content: center; text-align: center; }
  .intro-card {
    max-width: 540px; padding: 40px 34px; border-radius: 26px;
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 50px rgba(20,20,40,.18);
    animation: fadeInUp 1s ease both;
  }
  .intro-card p {
    font-family: Georgia, "Songti SC", "SimSun", serif;
    font-size: 19px; line-height: 2.2; letter-spacing: 1.5px;
  }
  .intro-card .em { color: var(--btn2); font-weight: 700; }
  body.night .intro-card .em { color: #ffc76a; }
  .thanks { margin-top: 30px; font-size: 14px; color: var(--sub); animation: fadeInUp 1.2s .3s ease both; text-align: center; }
  .veggie { display: inline-block; font-size: 20px; vertical-align: -3px; animation: wiggle 2.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(10deg) scale(1.12)} }
  @keyframes fadeInUp { from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:translateY(0)} }

  #introCoin {
    margin-top: 30px; width: 96px; height: 96px; cursor: pointer; user-select: none;
    perspective: 600px; animation: fadeInUp 1s .5s ease both;
    filter: drop-shadow(0 8px 14px rgba(20,20,40,.3));
    transition: transform .15s;
  }
  #introCoin:hover { transform: scale(1.06); }
  #introCoin:active { transform: scale(.95); }
  #introCoin svg { width: 100%; height: 100%; }
  #introCoin.flipping svg { animation: introSpin .9s cubic-bezier(.4,.1,.3,1) forwards; }
  @keyframes introSpin { from { transform: rotateX(0) } to { transform: rotateX(1080deg) } }
  .intro-hint { margin-top: 10px; font-size: 12.5px; color: var(--sub); animation: fadeInUp 1s .7s ease both; }

  /* ---------- 第二页 ---------- */
  #screen2 { padding: 12px 16px 14px; overflow-y: auto; }
  .topbtn {
    position: absolute; top: 16px; z-index: 3;
    padding: 8px 13px; border-radius: 999px; border: 1px solid var(--glass-line);
    background: var(--glass); color: var(--ink); font-size: 14px; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 14px rgba(0,0,0,.12); transition: transform .15s;
    line-height: 1;
  }
  .topbtn:active { transform: scale(.92); }
  #soundBtn  { left: 14px; }
  #themeBtn  { left: 58px; }
  #historyBtn { right: 14px; font-size: 13px; }

  #bubble {
    min-height: 32px; margin: 46px auto 4px; width: fit-content; max-width: 320px;
    background: var(--glass); border: 1px solid var(--glass-line);
    border-radius: 16px; padding: 7px 18px;
    font-size: 13.5px; color: var(--ink); text-align: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; transition: opacity .3s; position: relative;
  }
  #bubble.show { opacity: 1; }

  .stage { position: relative; width: 100%; max-width: 420px; height: 300px; flex-shrink: 0; }

  #coinWrap {
    position: absolute; top: 4px; left: 50%; margin-left: -78px;
    width: 156px; height: 156px; z-index: 2; perspective: 700px;
  }
  #coinWrap.tossing { animation: tossFly 1.15s cubic-bezier(.3,.1,.4,1) forwards; }
  @keyframes tossFly {
    0% { transform: translateY(0); }
    44% { transform: translateY(-240px); }
    56% { transform: translateY(-242px); }
    100% { transform: translateY(0); }
  }
  #coinWrap.bounce { animation: coinBounce .55s ease-out; }
  @keyframes coinBounce {
    0%   { transform: translateY(0)                 }
    30%  { transform: translateY(-18px)             }
    55%  { transform: translateY(0) scale(1.05,.95) }
    75%  { transform: translateY(-7px)              }
    100% { transform: translateY(0) scale(1,1)      }
  }
  #coinSvg { width: 100%; height: 100%; animation: idleFloat 4s ease-in-out infinite; }
  @keyframes idleFloat { 0%,100%{ transform: translateY(0) rotate(-2deg) } 50%{ transform: translateY(-8px) rotate(2deg) } }
  #coinWrap.spinning #coinSvg { animation: spinFast .15s linear infinite; }
  @keyframes spinFast { from { transform: rotateX(0deg) } to { transform: rotateX(360deg) } }
  #coinWrap.orGlow #coinSvg { animation: orPulse 1.6s ease-in-out infinite; }
  @keyframes orPulse { 0%,100%{ filter: drop-shadow(0 0 6px rgba(255,200,80,.5)) } 50%{ filter: drop-shadow(0 0 22px rgba(255,200,80,.95)) } }

  #hand {
    position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    width: 215px; z-index: 1; filter: drop-shadow(0 8px 10px rgba(20,20,40,.25));
  }
  #hand.flick { animation: flick .35s ease; }
  @keyframes flick { 0%{transform:translateX(-50%) translateY(0)} 45%{transform:translateX(-50%) translateY(-42px)} 100%{transform:translateX(-50%) translateY(0)} }

  #resultTip { min-height: 22px; font-size: 13.5px; color: var(--sub); text-align: center; margin-top: 2px; }

  /* 摇完后的两个按钮 */
  #afterBtns { display: none; gap: 10px; margin-top: 8px; }
  #afterBtns.show { display: flex; }
  #afterBtns button {
    padding: 10px 20px; border-radius: 999px; font-size: 13.5px; cursor: pointer;
    border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .15s, opacity .2s;
  }
  #afterBtns button:active { transform: scale(.94); }
  #retryBtn { font-weight: 700; }

  #questionInput {
    width: min(80vw, 380px); margin-top: 10px;
    padding: 13px 18px; border: 1px solid var(--glass-line); border-radius: 14px;
    font-size: 15px; background: var(--glass); color: var(--ink); outline: none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: border-color .2s;
  }
  #questionInput::placeholder { color: var(--sub); }
  #questionInput:focus { border-color: var(--btn1); }
  #startBtn {
    margin-top: 12px; padding: 13px 58px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, var(--btn1), var(--btn2));
    color: #fff; font-size: 18px; font-weight: 800; letter-spacing: 8px; text-indent: 8px;
    cursor: pointer; box-shadow: 0 8px 22px rgba(217,122,26,.4);
    transition: transform .15s, opacity .2s;
  }
  #startBtn:active { transform: scale(.94); }
  #startBtn:disabled { opacity: .6; }

  #customToggle { margin-top: 10px; font-size: 12px; color: var(--sub); cursor: pointer; text-decoration: underline dotted; user-select: none; }
  #customBox { display: none; gap: 8px; margin-top: 8px; width: min(80vw, 380px); }
  #customBox.open { display: flex; }
  #customBox input {
    flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--glass-line);
    border-radius: 12px; background: var(--glass); font-size: 13px; color: var(--ink); outline: none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #customBox input::placeholder { color: var(--sub); }

  .privacy-note { margin-top: 10px; font-size: 11px; color: var(--sub); opacity: .85; }

  /* ---------- 侧滑历史抽屉 ---------- */
  #drawerMask {
    position: fixed; inset: 0; z-index: 5; display: none;
    background: rgba(10,10,25,.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  #drawerMask.open { display: block; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 6;
    width: min(86vw, 350px);
    background: var(--glass); border-left: 1px solid var(--glass-line);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: -12px 0 40px rgba(0,0,0,.25);
    transform: translateX(105%); transition: transform .35s cubic-bezier(.3,.9,.3,1);
    display: flex; flex-direction: column; padding: 18px;
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .drawer-head h3 { font-size: 15px; }
  .drawer-head .btns button {
    margin-left: 8px; font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--glass-line); background: transparent; color: var(--ink);
  }
  #historyList { overflow-y: auto; flex: 1; }
  .rec-card { border-top: 1px dashed var(--glass-line); padding: 9px 0; }
  .rec-q { font-size: 13px; font-weight: 600; word-break: break-all; }
  .rec-tosses { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: rgba(150,150,150,.18); color: var(--ink); }
  .chip.yes { background: rgba(60,180,110,.22); color: #1d7a3e; }
  .chip.no  { background: rgba(220,90,90,.22);  color: #b03434; }
  body.night .chip.yes { color: #7de3a5; }
  body.night .chip.no  { color: #ff9d9d; }
  .chip.or  { background: rgba(150,90,220,.22); color: #8a3ec9; }
  body.night .chip.or { color: #cf9dff; }
  .rec-time { font-size: 10px; color: var(--sub); margin-top: 4px; }
  .empty-tip { font-size: 12px; color: var(--sub); text-align: center; padding: 14px 0; }

  /* ---------- 移动端适配 ---------- */
  @media (max-width: 480px) {
    .screen { padding: 16px 14px 12px; }
    .intro-card { padding: 28px 20px; border-radius: 20px; }
    .intro-card p { font-size: 16.5px; line-height: 2.05; }
    #introCoin { width: 80px; height: 80px; margin-top: 24px; }
    .stage { height: 258px; }
    #coinWrap { width: 126px; height: 126px; margin-left: -63px; }
    #hand { width: 178px; }
    #startBtn { padding: 12px 46px; font-size: 16px; }
    #questionInput, #customBox { width: 100%; }
    #soundBtn { left: 10px; } #themeBtn { left: 52px; } #historyBtn { right: 10px; }
  }
</style>
</head>
<body>

<div id="sky"></div>

<!-- ============ 第一页：简介 ============ -->
<div id="screen1" class="screen active">
  <div class="intro-card">
    <p>
      人生是一场选择。<br>
      <span class="em">yes</span> 和 <span class="em">no</span> 之外，<span class="em">or</span> 是犹豫者的第三扇门。<br>
      硬币只是参考 —— 抛出它的瞬间，<br>
      答案早已在你心里。
    </p>
  </div>
  <p class="thanks">在此特别感谢我的朋友 <span class="veggie">🥗</span> 先生的帮助。</p>
  <div id="introCoin" onclick="introFlip(event)">
    <svg viewBox="0 0 120 120">
      <polygon points="60,3 109,31.5 109,88.5 60,117 11,88.5 11,31.5"
               fill="url(#goldRim)" stroke="#8a5a0c" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="60,10 103,35 103,85 60,110 17,85 17,35"
               fill="url(#goldFace)" stroke="#c98a1d" stroke-width="1.2" stroke-linejoin="round"/>
      <ellipse cx="45" cy="52" rx="5" ry="6.4" fill="#4a2f0a"/>
      <ellipse cx="75" cy="52" rx="5" ry="6.4" fill="#4a2f0a"/>
      <circle cx="46.7" cy="49.8" r="2" fill="#fff"/>
      <circle cx="76.7" cy="49.8" r="2" fill="#fff"/>
      <circle cx="35" cy="63" r="5.2" fill="#ff9d6b" opacity=".5"/>
      <circle cx="85" cy="63" r="5.2" fill="#ff9d6b" opacity=".5"/>
      <path d="M53 67 q2.5 3 5 0 q2.5 3 5 0" stroke="#4a2f0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="intro-hint">👆 点击硬币，翻开下一页</div>
</div>

<!-- ============ 第二页：抛硬币 ============ -->
<div id="screen2" class="screen">
  <button id="soundBtn"  class="topbtn" onclick="toggleSound()">🔊</button>
  <button id="themeBtn"  class="topbtn" onclick="toggleTheme()">☀️</button>
  <button id="historyBtn" class="topbtn" onclick="openDrawer()">📜 记录</button>
  <div id="bubble"></div>

  <div class="stage">
    <div id="coinWrap">
      <svg id="coinSvg" viewBox="0 0 120 120">
        <defs>
          <radialGradient id="goldFace" cx="35%" cy="28%" r="85%">
            <stop offset="0%" stop-color="#fff9e0"/>
            <stop offset="42%" stop-color="#ffdd80"/>
            <stop offset="78%" stop-color="#eeb03a"/>
            <stop offset="100%" stop-color="#cf8318"/>
          </radialGradient>
          <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fbe7ac"/>
            <stop offset="50%" stop-color="#e8a92e"/>
            <stop offset="100%" stop-color="#9c6410"/>
          </linearGradient>
          <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a8641a" flood-opacity="0.45"/>
          </filter>
        </defs>
        <g filter="url(#coinGlow)">
          <polygon points="60,3 109,31.5 109,88.5 60,117 11,88.5 11,31.5"
                   fill="url(#goldRim)" stroke="#8a5a0c" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="60,10 103,35 103,85 60,110 17,85 17,35"
                   fill="url(#goldFace)" stroke="#c98a1d" stroke-width="1.2" stroke-linejoin="round"/>
          <polygon points="60,15 99,37.5 99,82.5 60,105 21,82.5 21,37.5"
                   fill="none" stroke="#fff2c4" stroke-width="1.2" stroke-linejoin="round" opacity=".55"/>
          <path d="M30 30 Q42 18 58 15" stroke="#fffdf2" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
          <g id="idleFace">
            <ellipse cx="45" cy="52" rx="5" ry="6.4" fill="#4a2f0a"/>
            <ellipse cx="75" cy="52" rx="5" ry="6.4" fill="#4a2f0a"/>
            <circle cx="46.7" cy="49.8" r="2" fill="#fff"/>
            <circle cx="76.7" cy="49.8" r="2" fill="#fff"/>
            <circle cx="35" cy="63" r="5.2" fill="#ff9d6b" opacity=".5"/>
            <circle cx="85" cy="63" r="5.2" fill="#ff9d6b" opacity=".5"/>
            <path d="M53 67 q2.5 3 5 0 q2.5 3 5 0" stroke="#4a2f0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </g>
          <g id="engraveYes" visibility="hidden">
            <text x="60" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                  font-size="29" font-weight="bold" letter-spacing="2" fill="#ffefc2">YES</text>
            <text x="60" y="71.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                  font-size="29" font-weight="bold" letter-spacing="2" fill="#7a4d0a">YES</text>
            <path d="M40 80 Q60 88 80 80" stroke="#a06a14" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          </g>
          <g id="engraveNo" visibility="hidden">
            <text x="60" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                  font-size="31" font-weight="bold" letter-spacing="3" fill="#ffefc2">NO</text>
            <text x="60" y="71.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                  font-size="31" font-weight="bold" letter-spacing="3" fill="#7a4d0a">NO</text>
            <path d="M40 80 Q60 88 80 80" stroke="#a06a14" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          </g>
          <g id="engraveOr" visibility="hidden">
            <text x="60" y="71" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                  font-size="33" font-weight="bold" font-style="italic" fill="#ffefc2">or</text>
            <text x="60" y="72.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                  font-size="33" font-weight="bold" font-style="italic" fill="#7a4d0a">or</text>
            <path d="M88 30 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="#fffbe8"/>
            <path d="M28 76 l1.1 2.8 2.8 1.1 -2.8 1.1 -1.1 2.8 -1.1 -2.8 -2.8 -1.1 2.8 -1.1 z" fill="#fffbe8"/>
          </g>
        </g>
      </svg>
    </div>
    <!-- 手：纤细手指木偶款（指掌相连 + 袖口） -->
    <div id="hand">
      <svg viewBox="0 0 220 192">
        <!-- 袖口（手腕） -->
        <rect x="90" y="164" width="56" height="26" rx="12" fill="#ffdcb0" stroke="#e0a878" stroke-width="2.5"/>
        <!-- 拇指（先画，基部被手掌盖住，自然相连） -->
        <g transform="rotate(-26 66 118)">
          <rect x="56" y="94" width="14" height="48" rx="7" fill="#ffe6c4" stroke="#eab08a" stroke-width="2"/>
          <rect x="50" y="80" width="26" height="32" rx="13" fill="#f0c14b" stroke="#c1932e" stroke-width="2"/>
          <path d="M60 88 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 z" fill="#fff3cf"/>
          <path d="M69 94 l0.8 2 2 0.8 -2 0.8 -0.8 2 -0.8 -2 -2 -0.8 2 -0.8 z" fill="#fff3cf"/>
        </g>
        <!-- 四根手指（下半截伸进手掌里） -->
        <rect x="77"  y="54" width="17" height="66" rx="8.5" fill="#ffe6c4" stroke="#eab08a" stroke-width="2"/>
        <rect x="99"  y="40" width="17" height="80" rx="8.5" fill="#ffe6c4" stroke="#eab08a" stroke-width="2"/>
        <rect x="121" y="48" width="17" height="72" rx="8.5" fill="#ffe6c4" stroke="#eab08a" stroke-width="2"/>
        <rect x="143" y="62" width="15" height="58" rx="7.5" fill="#ffe6c4" stroke="#eab08a" stroke-width="2"/>
        <!-- 手掌（后画，盖住指根连接处） -->

<script>
/* ================= 主题 & 音效偏好（本地记忆） ================= */
let soundOn = localStorage.getItem('hexcoin_sound') !== 'off';
let themePref = localStorage.getItem('hexcoin_theme') || ''; // '' = 跟随时间

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('hexcoin_sound', soundOn ? 'on' : 'off');
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) startAmbience(); else stopAmbience();
  bubble(soundOn ? '音效已开启 🔊' : '音效已关闭 🔇');
}
function toggleTheme() {
  const isNight = document.body.classList.contains('night');
  themePref = isNight ? 'day' : 'night';
  localStorage.setItem('hexcoin_theme', themePref);
  stopAmbience();
  initScene();
  if (soundOn) startAmbience();
  bubble(isNight ? '已切换到白天 ☀️' : '已切换到夜晚 🌙');
}

/* ================= 场景：昼夜 + 随机天气 / 夜晚外太空 ================= */
function initScene() {
  const hour = new Date().getHours();
  let isDay;
  if (themePref === 'day') isDay = true;
  else if (themePref === 'night') isDay = false;
  else isDay = hour >= 6 && hour < 18;

  const sky = document.getElementById('sky');
  sky.innerHTML = '';
  document.body.classList.remove('day', 'night', 'cloudy', 'overcast');
  document.getElementById('themeBtn').textContent = isDay ? '🌙' : '☀️';

  if (isDay) {
    const variants = ['sunny', 'cloudy', 'overcast'];
    const v = variants[Math.floor(Math.random() * variants.length)];
    document.body.classList.add('day');
    if (v !== 'sunny') document.body.classList.add(v);
    buildDay(sky, v);
  } else {
    document.body.classList.add('night');
    buildNight(sky);
  }
}
function el(parent, cls, style) {
  const d = document.createElement('div');
  d.className = cls;
  Object.assign(d.style, style);
  parent.appendChild(d);
  return d;
}
function buildDay(sky, v) {
  if (v === 'sunny') el(sky, 'sun', {});
  const clouds = v === 'sunny' ? 3 : (v === 'cloudy' ? 5 : 6);
  for (let i = 0; i < clouds; i++) {
    const w = 110 + Math.random() * 120;
    el(sky, 'cloud', {
      width: w + 'px', height: w * 0.28 + 'px',
      top: (6 + Math.random() * 45) + '%',
      opacity: v === 'overcast' ? 0.9 : (0.65 + Math.random() * 0.3),
      animationDuration: (50 + Math.random() * 70) + 's',
      animationDelay: -(Math.random() * 60) + 's',
    });
  }
}
function planetSVG(color, size) {
  return `<svg width="${size}" height="${size * 0.62}" viewBox="0 0 100 62">
    <circle cx="50" cy="31" r="17" fill="none" stroke="${color}" stroke-width="2"/>
    <ellipse cx="50" cy="31" rx="36" ry="10" fill="none" stroke="${color}" stroke-width="1.5" transform="rotate(-18 50 31)"/>
  </svg>`;
}
function satelliteSVG() {
  return `<svg width="52" height="30" viewBox="0 0 52 30">
    <rect x="22" y="10" width="8" height="10" rx="2" fill="#d8dcea"/>
    <rect x="2" y="12" width="18" height="6" rx="1.5" fill="#4a6fd6"/>
    <rect x="32" y="12" width="18" height="6" rx="1.5" fill="#4a6fd6"/>
    <line x1="20" y1="15" x2="22" y2="15" stroke="#888" stroke-width="1.5"/>
    <line x1="30" y1="15" x2="32" y2="15" stroke="#888" stroke-width="1.5"/>
  </svg>`;
}
function buildNight(sky) {
  for (let i = 0; i < 46; i++) {
    const s = 1.5 + Math.random() * 2.5;
    el(sky, 'star', {
      width: s + 'px', height: s + 'px',
      top: Math.random() * 70 + '%', left: Math.random() * 98 + '%',
      animationDuration: (1.8 + Math.random() * 3) + 's',
      animationDelay: -(Math.random() * 3) + 's',
    });
  }
  el(sky, 'moon', {});
  const planets = [
    { c: '#f0c98a', x: '8%',  y: '58%', s: 120, d: '7s'  },
    { c: '#9db8e8', x: '72%', y: '14%', s: 150, d: '9s'  },
    { c: '#e8e2d0', x: '14%', y: '12%', s: 95,  d: '8s'  },
    { c: '#c9a8e0', x: '78%', y: '62%', s: 110, d: '10s' },
  ];
  planets.forEach(p => {
    const d = el(sky, 'planet', { left: p.x, top: p.y, animationDuration: p.d });
    d.innerHTML = planetSVG(p.c, p.s);
  });
  const sat = el(sky, 'satellite', { top: '30%', animationDuration: '75s' });
  sat.innerHTML = satelliteSVG();
  [0, 2.4, 4.8].forEach((delay, i) => {
    el(sky, 'meteor', {
      top: (5 + i * 9) + '%', left: (46 + i * 14) + '%',
      animationDelay: -delay + 's',
    });
  });
}

/* ================= 音效（Web Audio 合成） ================= */
let ac = null, _noise = null;
function ensureAudio() {
  if (!soundOn) return false;
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  if (!_noise) {
    _noise = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = _noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return true;
}
function whoosh(up) {
  if (!ensureAudio()) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = _noise; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(up ? 280 : 1400, t);
  f.frequency.exponentialRampToValueAtTime(up ? 1500 : 260, t + 0.3);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.07);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t); src.stop(t + 0.4);
}
function flipTick(delay, pitch) {
  if (!ensureAudio()) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = pitch;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.06);
}
function thud() {
  if (!ensureAudio()) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(65, t + 0.18);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.3);
}

/* ================= 昼夜环境音（白天鸟鸣+微风 / 夜晚虫鸣+夜风） ================= */
let ambTimer = null, windSrc = null, windGain = null, droneNodes = null;
function startAmbience() {
  if (!soundOn) return;
  if (!ensureAudio()) return;
  if (ambTimer) return;
  const night = document.body.classList.contains('night');
  const overcast = document.body.classList.contains('overcast');
  // 持续底噪：夜里极轻，阴天风声更明显
  windSrc = ac.createBufferSource(); windSrc.buffer = _noise; windSrc.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = night ? 160 : 240;
  windGain = ac.createGain();
  windGain.gain.value = night ? 0.005 : (overcast ? 0.028 : 0.014);
  windSrc.connect(f); f.connect(windGain); windGain.connect(ac.destination);
  windSrc.start();
  if (night) startDrone();
  scheduleAmb();
  ambTimer = setInterval(scheduleAmb, 3000);
}
function stopAmbience() {
  if (ambTimer) { clearInterval(ambTimer); ambTimer = null; }
  if (windSrc) { try { windSrc.stop(); } catch (e) {} windSrc = null; windGain = null; }
  stopDrone();
}
function scheduleAmb() {
  if (!soundOn || !ac || ac.state !== 'running') return;
  const body = document.body.classList;
  if (body.contains('night')) {
    // 外太空：低鸣常驻，偶发掠过的呼啸与星星微响，没有鸟虫
    if (Math.random() < 0.35) spaceWhoosh();
    if (Math.random() < 0.25) starPing();
  } else if (body.contains('overcast')) {
    // 阴天：只有风声阵阵，没有鸟虫
    if (Math.random() < 0.7) windGust();
  } else if (body.contains('cloudy')) {
    // 多云：偶尔鸟叫 + 阵风
    if (Math.random() < 0.35) birdChirp();
    if (Math.random() < 0.3) windGust();
  } else {
    // 晴天：海浪为主（更响）+ 偶尔鸟叫
    if (Math.random() < 0.85) waveSwell();
    if (Math.random() < 0.4) birdChirp();
  }
}
/* 太空低鸣：两只略微失谐的低频正弦波缓慢起伏 */
function startDrone() {
  const g = ac.createGain(); g.gain.value = 0.016;
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = 52 + Math.random() * 8;
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = 52.7 + Math.random() * 8;
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.07 + Math.random() * 0.05;
  const lg = ac.createGain(); lg.gain.value = 0.008;
  lfo.connect(lg); lg.connect(g.gain);
  o1.connect(g); o2.connect(g); g.connect(ac.destination);
  o1.start(); o2.start(); lfo.start();
  droneNodes = { o1, o2, lfo, g };
}
function stopDrone() {
  if (!droneNodes) return;
  try { droneNodes.o1.stop(); droneNodes.o2.stop(); droneNodes.lfo.stop(); } catch (e) {}
  droneNodes = null;
}
function birdChirp() {
  const t0 = ac.currentTime + Math.random() * 0.6;
  const notes = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < notes; i++) {
    const base = 2200 + Math.random() * 900;
    const st = t0 + i * (0.13 + Math.random() * 0.06);
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(base, st);
    o.frequency.exponentialRampToValueAtTime(base * 1.5, st + 0.05);
    o.frequency.exponentialRampToValueAtTime(base * 0.85, st + 0.11);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.022, st + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 0.13);
    o.connect(g); g.connect(ac.destination);
    o.start(st); o.stop(st + 0.15);
  }
}
/* 海浪：一次涌来又退去的浪声（每次时长/滤波/响度都随机，不重样） */
function waveSwell() {
  const t0 = ac.currentTime + 0.1;
  const dur = 3.5 + Math.random() * 2.5;
  const src = ac.createBufferSource(); src.buffer = _noise; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(420 + Math.random() * 320, t0);
  f.frequency.exponentialRampToValueAtTime(170 + Math.random() * 60, t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.055 + Math.random() * 0.03, t0 + dur * (0.3 + Math.random() * 0.2));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t0); src.stop(t0 + dur + 0.1);
}
/* 阵风：一阵吹过又停的风 */
function windGust() {
  const t0 = ac.currentTime + 0.1;
  const dur = 2 + Math.random() * 2.2;
  const src = ac.createBufferSource(); src.buffer = _noise; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.9;
  const base = 300 + Math.random() * 260;
  f.frequency.setValueAtTime(base, t0);
  f.frequency.linearRampToValueAtTime(base * (1.5 + Math.random() * 0.8), t0 + dur * 0.45);
  f.frequency.linearRampToValueAtTime(base * 0.7, t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.02 + Math.random() * 0.018, t0 + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t0); src.stop(t0 + dur + 0.1);
}
/* 太空呼啸：某个东西从耳边掠过的低频扫风 */
function spaceWhoosh() {
  const t0 = ac.currentTime + Math.random() * 0.5;
  const dur = 2.2 + Math.random() * 1.8;
  const src = ac.createBufferSource(); src.buffer = _noise; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.6;
  f.frequency.setValueAtTime(140 + Math.random() * 80, t0);
  f.frequency.exponentialRampToValueAtTime(600 + Math.random() * 400, t0 + dur * 0.5);
  f.frequency.exponentialRampToValueAtTime(120 + Math.random() * 60, t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.012 + Math.random() * 0.008, t0 + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t0); src.stop(t0 + dur + 0.1);
}
/* 星之微响：一颗星星闪了一下的一声轻响（每次音高时长都不同） */
function starPing() {
  const st = ac.currentTime + Math.random() * 0.8;
  const freq = 900 + Math.random() * 1100;
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, st);
  g.gain.exponentialRampToValueAtTime(0.006 + Math.random() * 0.005, st + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, st + 0.7 + Math.random() * 0.8);
  o.connect(g); g.connect(ac.destination);
  o.start(st); o.stop(st + 1.6);
}

/* ================= 概率：47.5% / 47.5% / 5% + 每10次保底1~2次or ================= */
function rollResult(history) {
  const last9 = history.slice(-9);
  const orIn9 = last9.filter(x => x.r === 'or').length;
  if (orIn9 === 0) return 'or';
  if (orIn9 >= 2 && last9.length === 9) return Math.random() < 0.5 ? 'yes' : 'no';
  const r = Math.random();
  return r < 0.475 ? 'yes' : (r < 0.95 ? 'no' : 'or');
}

/* ================= 记录（localStorage，仅本设备） ================= */
const KEY = 'hexcoin_records_v1';
function loadRecords() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function saveRecords(rs) { localStorage.setItem(KEY, JSON.stringify(rs)); }
function appendToss(qText, result, label) {
  const rs = loadRecords();
  let rec = rs.find(r => r.q === qText);
  if (!rec) { rec = { q: qText, tosses: [], time: Date.now() }; rs.unshift(rec); }
  rec.tosses.push({ r: result, label: label || '', t: Date.now() });
  saveRecords(rs);
  return rec;
}
function clearRecords() {
  if (confirm('确定要清空本机上的全部记录吗？')) { saveRecords([]); renderHistory(); }
}
function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderHistory() {
  const list = document.getElementById('historyList');
  const rs = loadRecords();
  if (!rs.length) { list.innerHTML = '<div class="empty-tip">还没有记录，抛第一枚硬币吧～</div>'; return; }
  list.innerHTML = rs.map(rec => `
    <div class="rec-card">
      <div class="rec-q">❓ ${escapeHtml(rec.q)}</div>
      <div class="rec-tosses">
        ${rec.tosses.map((t, i) => `<span class="chip ${t.r}">第${i + 1}次 · ${escapeHtml(t.label || t.r.toUpperCase())}</span>`).join('')}
      </div>
      <div class="rec-time">共 ${rec.tosses.length} 次抛掷 · 最近 ${fmtTime(rec.tosses[rec.tosses.length - 1].t)}</div>
    </div>`).join('');
}
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function openDrawer()  { renderHistory(); document.getElementById('drawerMask').classList.add('open'); document.getElementById('drawer').classList.add('open'); }
function closeDrawer() { document.getElementById('drawerMask').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }

/* ================= 气泡与台词 ================= */
const bubbleEl = document.getElementById('bubble');
let bubbleTimer = null;
function bubble(msg, keep) {
  bubbleEl.textContent = msg;
  bubbleEl.classList.add('show');
  clearTimeout(bubbleTimer);
  if (!keep) bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), 2600);
}
const wittyStart = [
  '别眨眼，命运要出手了！',
  '问题收到，硬币已就位～',
  '我转的可不是硬币，是你的命运（bushi）',
  '抛之前，心里默念三遍你想要的那个答案 😉',
  '加油啊硬币，全靠你了！',
];
const dizzyMsg = '不要再抛啦，我要摇晕啦，就选择它吧！🤪';
const tipFns = {
  yes: L => `命运点头：选「${L.yes}」不会有错 ✨`,
  no:  L => `命运摇头：放下「${L.no}」，前方有更好的在等你 🍃`,
  or:  L => `硬币立了起来——or：都要，或者都不要 😏`,
};

/* ================= 页面切换 & 开场仪式 ================= */
function goNext() {
  document.getElementById('screen1').classList.remove('active');
  document.getElementById('screen2').classList.add('active');
}
function introFlip(e) {
  const coin = document.getElementById('introCoin');
  if (coin.classList.contains('flipping')) return;
  coin.classList.add('flipping');
  startAmbience();
  if (ensureAudio()) {
    let d = 0;
    for (let i = 0; i < 8; i++) { flipTick(d, 900 + Math.random() * 400); d += 0.09; }
  }
  setTimeout(goNext, 850);
}

/* ================= 自定义两个选项 ================= */
function toggleCustom() { document.getElementById('customBox').classList.toggle('open'); }
function getLabels() {
  const a = document.getElementById('optA').value.trim();
  const b = document.getElementById('optB').value.trim();
  return (a && b) ? { yes: a, no: b, or: 'or' } : { yes: 'YES', no: 'NO', or: 'or' };
}

/* ================= 抛掷主流程 ================= */
const coinWrap = document.getElementById('coinWrap');
const hand = document.getElementById('hand');
const tipEl = document.getElementById('resultTip');
const startBtn = document.getElementById('startBtn');
const input = document.getElementById('questionInput');
const afterBtns = document.getElementById('afterBtns');
let tossing = false;
let lastShare = null;

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function showFace(id) {
  ['idleFace', 'engraveYes', 'engraveNo', 'engraveOr'].forEach(g => {
    document.getElementById(g).setAttribute('visibility', g === id ? 'visible' : 'hidden');
  });
  coinWrap.classList.toggle('orGlow', id === 'engraveOr');
}

async function startToss() {
  const qText = input.value.trim();
  if (!qText) { bubble('先写下你的纠结吧 ✍️'); input.focus(); return; }
  const a = document.getElementById('optA').value.trim();
  const b = document.getElementById('optB').value.trim();
  if ((a && !b) || (!a && b)) { bubble('两个选项要么都填，要么都不填哦 🙃'); return; }
  if (tossing) return;               // 动画期间禁止重复点击
  tossing = true;
  startBtn.disabled = true;
  afterBtns.classList.remove('show');
  ensureAudio();

  tipEl.textContent = '';
  showFace('idleFace');
  coinWrap.classList.remove('orGlow', 'bounce');
  bubble(wittyStart[Math.floor(Math.random() * wittyStart.length)]);
  await wait(900);

  hand.classList.add('flick');
  whoosh(true);
  coinWrap.classList.add('tossing');
  coinWrap.classList.add('spinning');
  let delay = 0;
  for (let i = 0; i < 10; i++) {
    flipTick(delay, 900 + Math.random() * 500);
    delay += 0.07 + i * 0.012;
  }
  await wait(950);
  whoosh(false);
  await wait(210);

  coinWrap.classList.remove('tossing');
  coinWrap.classList.remove('spinning');
  coinWrap.classList.add('bounce');
  hand.classList.remove('flick');
  thud();
  setTimeout(() => coinWrap.classList.remove('bounce'), 600);

  const rs = loadRecords();
  const prev = rs.find(r => r.q === qText);
  const result = rollResult(prev ? prev.tosses : []);
  const labels = getLabels();
  const rec = appendToss(qText, result, labels[result]);

  if (result === 'yes') showFace('engraveYes');
  else if (result === 'no') showFace('engraveNo');
  else showFace('engraveOr');
  tipEl.textContent = tipFns[result](labels);

  lastShare = { q: qText, labels, r: result };
  afterBtns.classList.add('show');

  const t = rec.tosses;
  if (t.length >= 3 && t.slice(-3).every(x => x.r === result)) {
    setTimeout(() => bubble(dizzyMsg, true), 700);
  }

  tossing = false; startBtn.disabled = false;
}

/* ================= 复制分享（固定模板） ================= */
function copyShare() {
  if (!lastShare) return;
  const { q, labels, r } = lastShare;
  const mark = r === 'yes' ? '✔' : (r === 'no' ? '✘' : '🎲');
  const resultWord = r === 'or' ? '都要 / 都不要' : labels[r];
  const text = `🔮 抉择硬币 · 参考意见\n问：${q}\n选项：A = ${labels.yes} / B = ${labels.no}\n硬币说：${r.toUpperCase()} ${mark}（${resultWord}）\n—— 硬币仅供参考，真正的答案在你心里`;
  const done = () => bubble('已复制，去分享吧 📋');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { bubble('复制失败，长按手动复制吧'); }
  document.body.removeChild(ta);
}

/* ================= 初始化 ================= */
document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
initScene();
// 浏览器要求：声音必须在用户第一次点击/触摸后才能启动
document.addEventListener('pointerdown', function once() {
  startAmbience();
  document.removeEventListener('pointerdown', once);
});
</script>
