<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>命运六边形硬币</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fdf6e9 0%, #fdeedc 45%, #f9e0c0 100%);
    color: #4a3728;
    overflow: hidden;
  }
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
    padding: 24px;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  /* ---------- 第一页 ---------- */
  #screen1 { justify-content: center; align-items: center; text-align: center; }
  .intro-text {
    max-width: 520px; font-size: 19px; line-height: 2.1;
    letter-spacing: 1px; font-weight: 500;
    animation: fadeInUp 1s ease both;
  }
  .intro-text .em { color: #c07b1e; font-weight: 700; }
  .thanks {
    margin-top: 56px; font-size: 15px; color: #8a7258;
    animation: fadeInUp 1.2s .4s ease both;
  }
  .veggie { display: inline-block; font-size: 22px; vertical-align: -3px; animation: wiggle 2.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg);} 50% { transform: rotate(10deg) scale(1.12);} }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px);} to { opacity: 1; transform: translateY(0);} }
  .next-btn {
    position: absolute; right: 28px; bottom: 32px;
    padding: 13px 34px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #f0a832, #d97a1a);
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 4px;
    cursor: pointer; box-shadow: 0 6px 18px rgba(217,122,26,.35);
    transition: transform .15s;
  }
  .next-btn:active { transform: scale(.94); }

  /* ---------- 第二页 ---------- */
  #screen2 { align-items: center; justify-content: flex-start; padding-top: 8vh; overflow: hidden; }
  #bubble {
    min-height: 34px; margin-bottom: 8px;
    background: #fff; border-radius: 16px; padding: 8px 18px;
    font-size: 14px; color: #7a5c3a; max-width: 320px; text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    opacity: 0; transition: opacity .3s; position: relative;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px;
    transform: translateX(-50%);
    border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
  }

  .stage { position: relative; width: 260px; height: 240px; display: flex; justify-content: center; }
  #hand {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    font-size: 64px; z-index: 1;
  }
  #hand.flick { animation: flick .35s ease; }
  @keyframes flick { 0%{transform:translateX(-50%) translateY(0);} 45%{transform:translateX(-50%) translateY(-34px);} 100%{transform:translateX(-50%) translateY(0);} }
  #coinWrap {
    position: absolute; top: 6px; left: 50%; margin-left: -70px;
    width: 140px; height: 140px; z-index: 2;
    perspective: 600px;
  }
  #coinWrap.tossing { animation: tossFly 1.15s cubic-bezier(.3,.1,.4,1) forwards; }
  @keyframes tossFly {
    0%   { transform: translateY(0); }
    44%  { transform: translateY(-230px); }
    56%  { transform: translateY(-232px); }
    100% { transform: translateY(0); }
  }
  #coinSvg { width: 100%; height: 100%; animation: idleWiggle 3s ease-in-out infinite; }
  @keyframes idleWiggle { 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
  #coinWrap.spinning #coinSvg { animation: spinFast .16s linear infinite; }
  @keyframes spinFast { from { transform: rotateX(0deg);} to { transform: rotateX(360deg);} }

  #result {
    margin-top: 4px; font-size: 42px; font-weight: 800; letter-spacing: 3px;
    opacity: 0; transform: scale(.6); transition: all .35s cubic-bezier(.2,1.6,.4,1);
    min-height: 56px; text-align: center;
  }
  #result.show { opacity: 1; transform: scale(1); }
  #resultTip { font-size: 13px; color: #a08662; min-height: 20px; margin-bottom: 4px; }

  #questionInput {
    width: min(78vw, 360px); margin-top: 6px;
    padding: 13px 18px; border: 2px solid #eccfa3; border-radius: 14px;
    font-size: 15px; background: #fffdf8; color: #4a3728; outline: none;
    transition: border-color .2s;
  }
  #questionInput:focus { border-color: #f0a832; }
  #startBtn {
    margin-top: 14px; padding: 13px 56px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #f0a832, #d97a1a);
    color: #fff; font-size: 18px; font-weight: 800; letter-spacing: 6px;
    cursor: pointer; box-shadow: 0 6px 18px rgba(217,122,26,.35);
    transition: transform .15s, opacity .2s;
  }
  #startBtn:active { transform: scale(.94); }
  #startBtn:disabled { opacity: .6; }

  .privacy-note { margin-top: 14px; font-size: 12px; color: #b09a7d; }

  /* ---------- 记录区 ---------- */
  #historyPanel {
    margin-top: 10px; width: min(92vw, 420px);
    max-height: 26vh; overflow-y: auto;
    background: rgba(255,255,255,.75); border-radius: 16px; padding: 12px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.06);
  }
  #historyPanel h3 { font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  #clearBtn { font-size: 11px; color: #c07b1e; background: none; border: 1px solid #eccfa3; border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  .rec-card { border-top: 1px dashed #e8d6b8; padding: 8px 0; }
  .rec-q { font-size: 13px; font-weight: 600; word-break: break-all; }
  .rec-tosses { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #f6ead2; color: #7a5c3a; }
  .chip.yes { background: #dcf5e3; color: #1d7a3e; }
  .chip.no  { background: #fde3e3; color: #b03434; }
  .chip.or  { background: #efe1fd; color: #7a34b0; }
  .rec-time { font-size: 10px; color: #b8a488; margin-top: 4px; }
  .empty-tip { font-size: 12px; color: #b8a488; text-align: center; padding: 10px 0; }

  /* 六边形硬币 SVG 内部 */
  .face { pointer-events: none; }
</style>
</head>
<body>

<!-- ============ 第一页：简介 ============ -->
<div id="screen1" class="screen active">
  <p class="intro-text">
    人生是一场由无数选择拼成的长卷。<br>
    <span class="em">yes</span> 是一种选择，<span class="em">no</span> 也是一种选择，<span class="em">or</span> 是留给命运的浪漫。<br>
    有时候，不选择，本身也是一种选择。<br>
    硬币会转，但答案，其实一直藏在你心里。
  </p>
  <p class="thanks">在此特别感谢我的朋友 <span class="veggie">🥗</span> 先生的帮助。</p>
  <button class="next-btn" onclick="goNext()">下一步</button>
</div>

<!-- ============ 第二页：抛硬币 ============ -->
<div id="screen2" class="screen">
  <div id="bubble"></div>

  <div class="stage">
    <div id="coinWrap">
      <svg id="coinSvg" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe9a8"/>
            <stop offset="50%" stop-color="#f5b942"/>
            <stop offset="100%" stop-color="#d98e1f"/>
          </linearGradient>
        </defs>
        <polygon points="60,5 107,32.5 107,87.5 60,115 13,87.5 13,32.5"
                 fill="url(#gold)" stroke="#b57a12" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="60,15 98,37 98,83 60,105 22,83 22,37"
                 fill="none" stroke="#fff3cf" stroke-width="2.5" stroke-linejoin="round" opacity=".8"/>
        <g class="face">
          <ellipse cx="45" cy="52" rx="4.5" ry="6" fill="#5b3d10"/>
          <ellipse cx="75" cy="52" rx="4.5" ry="6" fill="#5b3d10"/>
          <circle cx="46.5" cy="50" r="1.6" fill="#fff"/>
          <circle cx="76.5" cy="50" r="1.6" fill="#fff"/>
          <circle cx="36" cy="64" r="5" fill="#ff9d6b" opacity=".55"/>
          <circle cx="84" cy="64" r="5" fill="#ff9d6b" opacity=".55"/>
          <path d="M48 70 Q60 80 72 70" stroke="#5b3d10" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </g>
        <path d="M30 30 Q42 18 58 16" stroke="#fffbe8" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
      </svg>
    </div>
    <div id="hand">🤚</div>
  </div>

  <div id="result"></div>
  <div id="resultTip"></div>

  <input id="questionInput" type="text" maxlength="50" placeholder="在这里写下你的问题…" autocomplete="off">
  <button id="startBtn" onclick="startToss()">开始</button>

  <div class="privacy-note">🔒 问题和记录只保存在你自己的设备上，别人看不到</div>

  <div id="historyPanel">
    <h3>📜 我的抉择记录 <button id="clearBtn" onclick="clearRecords()">清空</button></h3>
    <div id="historyList"></div>
  </div>
</div>

<script>
/* ================= 页面切换 ================= */
function goNext() {
  document.getElementById('screen1').classList.remove('active');
  document.getElementById('screen2').classList.add('active');
  renderHistory();
}

/* ================= 音效（Web Audio 合成，无需外部文件） ================= */
let ac = null, _noise = null;
function ensureAudio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  if (!_noise) {
    _noise = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = _noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
}
function whoosh(up) { // 抛出 / 落下的风声
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = _noise; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(up ? 280 : 1400, t);
  f.frequency.exponentialRampToValueAtTime(up ? 1500 : 260, t + 0.3);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.07);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t); src.stop(t + 0.4);
}
function flipTick(delay, pitch) { // 翻转的金属嗒嗒声
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = pitch;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.06);
}
function thud() { // 手接住的闷响
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(65, t + 0.18);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.3);
}

/* ================= 概率：47.5% / 47.5% / 5%  + 每10次保底1~2次or ================= */
function rollResult(history) {
  const last9 = history.slice(-9);
  const orIn9 = last9.filter(x => x.r === 'or').length;
  if (orIn9 === 0) return 'or';                       // 保底：近10次内必出至少1次 or
  if (orIn9 >= 2 && last9.length === 9) {             // 封顶：近10次内最多2次 or
    return Math.random() < 0.5 ? 'yes' : 'no';
  }
  const r = Math.random();
  return r < 0.475 ? 'yes' : (r < 0.95 ? 'no' : 'or');
}

/* ================= 记录（localStorage，仅本设备） ================= */
const KEY = 'hexcoin_records_v1';
function loadRecords() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function saveRecords(rs) { localStorage.setItem(KEY, JSON.stringify(rs)); }

function appendToss(qText, result) {
  const rs = loadRecords();
  let rec = rs.find(r => r.q === qText);
  if (!rec) { rec = { q: qText, tosses: [], time: Date.now() }; rs.unshift(rec); }
  rec.tosses.push({ r: result, t: Date.now() });
  saveRecords(rs);
  return rec;
}
function clearRecords() {
  if (confirm('确定要清空本机上的全部记录吗？')) { saveRecords([]); renderHistory(); }
}
function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderHistory() {
  const list = document.getElementById('historyList');
  const rs = loadRecords();
  if (!rs.length) { list.innerHTML = '<div class="empty-tip">还没有记录，抛第一枚硬币吧～</div>'; return; }
  list.innerHTML = rs.map(rec => `
    <div class="rec-card">
      <div class="rec-q">❓ ${escapeHtml(rec.q)}</div>
      <div class="rec-tosses">
        ${rec.tosses.map((t, i) => `<span class="chip ${t.r}">第${i + 1}次 · ${t.r.toUpperCase()}</span>`).join('')}
      </div>
      <div class="rec-time">共 ${rec.tosses.length} 次抛掷 · 最近 ${fmtTime(rec.tosses[rec.tosses.length - 1].t)}</div>
    </div>`).join('');
}
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ================= 气泡与台词 ================= */
const bubbleEl = document.getElementById('bubble');
let bubbleTimer = null;
function bubble(msg, keep) {
  bubbleEl.textContent = msg;
  bubbleEl.classList.add('show');
  clearTimeout(bubbleTimer);
  if (!keep) bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), 2600);
}

const wittyStart = [
  '别眨眼，命运要出手了！',
  '问题收到，硬币已就位～',
  '我转的可不是硬币，是你的命运（bushi）',
  '抛之前，心里默念三遍你想要的那个答案 😉',
  '加油啊硬币，全靠你了！',
];
const dizzyMsg = '不要再抛啦，我要摇晕啦，就选择它吧！🤪';
const resultTipMap = {
  yes: '命运点头：勇敢去做的你，会有好结果的 ✨',
  no:  '命运摇头：放下它，前方有更好的在等你 🍃',
  or:  '命运摊手：or —— 全都要，或者都不要 😏',
};

/* ================= 抛掷主流程 ================= */
const coinWrap = document.getElementById('coinWrap');
const hand = document.getElementById('hand');
const resultEl = document.getElementById('result');
const tipEl = document.getElementById('resultTip');
const startBtn = document.getElementById('startBtn');
const input = document.getElementById('questionInput');
let tossing = false;

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function setHand(emoji) { hand.textContent = emoji; }

async function startToss() {
  const qText = input.value.trim();
  if (!qText) { bubble('先写下你想问的事吧 ✍️'); input.focus(); return; }
  if (tossing) return;
  tossing = true; startBtn.disabled = true;
  ensureAudio();

  resultEl.classList.remove('show'); tipEl.textContent = '';
  bubble(wittyStart[Math.floor(Math.random() * wittyStart.length)]);
  await wait(900);

  // 抛出
  setHand('🫱');
  hand.classList.add('flick');
  whoosh(true);
  coinWrap.classList.add('tossing');
  coinWrap.classList.add('spinning');
  // 翻转音效：快→慢的嗒嗒声
  let delay = 0;
  for (let i = 0; i < 10; i++) {
    flipTick(delay, 900 + Math.random() * 500);
    delay += 0.07 + i * 0.012;
  }
  await wait(950);
  whoosh(false); // 落回来的风声
  await wait(210);

  // 接住
  coinWrap.classList.remove('tossing');
  coinWrap.classList.remove('spinning');
  hand.classList.remove('flick');
  setHand('🤚');
  thud();

  const rs = loadRecords();
  const prev = rs.find(r => r.q === qText);
  const result = rollResult(prev ? prev.tosses : []);
  const rec = appendToss(qText, result);

  // 结果展示
  const colors = { yes: '#1d9d4c', no: '#d64545', or: '#8a3ec9' };
  resultEl.textContent = result.toUpperCase();
  resultEl.style.color = colors[result];
  resultEl.classList.add('show');
  tipEl.textContent = resultTipMap[result];

  // 连续3次相同 → 硬币抗议
  const t = rec.tosses;
  if (t.length >= 3 && t.slice(-3).every(x => x.r === result)) {
    setTimeout(() => bubble(dizzyMsg, true), 700);
  }

  renderHistory();
  tossing = false; startBtn.disabled = false;
}
</script>
</body>
</html>
