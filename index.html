<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>抉择硬币</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fdf6e9 0%, #fdeedc 45%, #f9e0c0 100%);
    color: #4a3728;
    overflow: hidden;
  }
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
    padding: 24px;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  /* ---------- 第一页 ---------- */
  #screen1 { justify-content: center; align-items: center; text-align: center; }
  .intro-text {
    max-width: 520px; font-size: 19px; line-height: 2.1;
    letter-spacing: 1px; font-weight: 500;
    animation: fadeInUp 1s ease both;
  }
  .intro-text .em { color: #c07b1e; font-weight: 700; }
  .thanks {
    margin-top: 56px; font-size: 15px; color: #8a7258;
    animation: fadeInUp 1.2s .4s ease both;
  }
  .veggie { display: inline-block; font-size: 22px; vertical-align: -3px; animation: wiggle 2.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg);} 50% { transform: rotate(10deg) scale(1.12);} }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px);} to { opacity: 1; transform: translateY(0);} }
  .next-btn {
    position: absolute; right: 28px; bottom: 32px;
    padding: 13px 34px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #f0a832, #d97a1a);
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 4px;
    cursor: pointer; box-shadow: 0 6px 18px rgba(217,122,26,.35);
    transition: transform .15s;
  }
  .next-btn:active { transform: scale(.94); }

  /* ---------- 第二页 ---------- */
  #screen2 { align-items: center; justify-content: flex-start; padding-top: 8vh; overflow: hidden; }
  #bubble {
    min-height: 34px; margin-bottom: 8px;
    background: #fff; border-radius: 16px; padding: 8px 18px;
    font-size: 14px; color: #7a5c3a; max-width: 320px; text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    opacity: 0; transition: opacity .3s; position: relative;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px;
    transform: translateX(-50%);
    border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
  }

  .stage { position: relative; width: 260px; height: 240px; display: flex; justify-content: center; }
  #hand {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    width: 180px; z-index: 1; filter: drop-shadow(0 6px 8px rgba(90,50,10,.25));
  }
  #hand.flick { animation: flick .35s ease; }
  @keyframes flick { 0%{transform:translateX(-50%) translateY(0);} 45%{transform:translateX(-50%) translateY(-40px);} 100%{transform:translateX(-50%) translateY(0);} }
  #coinWrap {
    position: absolute; top: 6px; left: 50%; margin-left: -70px;
    width: 140px; height: 140px; z-index: 2;
    perspective: 600px;
  }
  #coinWrap.tossing { animation: tossFly 1.15s cubic-bezier(.3,.1,.4,1) forwards; }
  @keyframes tossFly {
    0%   { transform: translateY(0); }
    44%  { transform: translateY(-230px); }
    56%  { transform: translateY(-232px); }
    100% { transform: translateY(0); }
  }
  #coinSvg { width: 100%; height: 100%; animation: idleWiggle 3s ease-in-out infinite; }
  @keyframes idleWiggle { 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
  #coinWrap.spinning #coinSvg { animation: spinFast .16s linear infinite; }
  @keyframes spinFast { from { transform: rotateX(0deg);} to { transform: rotateX(360deg);} }

  #result {
    margin-top: 4px; font-size: clamp(26px, 8vw, 42px); font-weight: 800; letter-spacing: 3px;
    opacity: 0; transform: scale(.6); transition: all .35s cubic-bezier(.2,1.6,.4,1);
    min-height: 56px; text-align: center;
  }
  #result.show { opacity: 1; transform: scale(1); }
  #resultTip { font-size: 13px; color: #a08662; min-height: 20px; margin-bottom: 4px; }

  #questionInput {
    width: min(78vw, 360px); margin-top: 6px;
    padding: 13px 18px; border: 2px solid #eccfa3; border-radius: 14px;
    font-size: 15px; background: #fffdf8; color: #4a3728; outline: none;
    transition: border-color .2s;
  }
  #questionInput:focus { border-color: #f0a832; }
  #startBtn {
    margin-top: 14px; padding: 13px 56px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #f0a832, #d97a1a);
    color: #fff; font-size: 18px; font-weight: 800; letter-spacing: 6px;
    cursor: pointer; box-shadow: 0 6px 18px rgba(217,122,26,.35);
    transition: transform .15s, opacity .2s;
  }
  #startBtn:active { transform: scale(.94); }
  #startBtn:disabled { opacity: .6; }

  .privacy-note { margin-top: 14px; font-size: 12px; color: #b09a7d; }

  /* ---------- 记录区 ---------- */
  #historyPanel {
    margin-top: 10px; width: min(92vw, 420px);
    max-height: 26vh; overflow-y: auto;
    background: rgba(255,255,255,.75); border-radius: 16px; padding: 12px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.06);
  }
  #historyPanel h3 { font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  #clearBtn { font-size: 11px; color: #c07b1e; background: none; border: 1px solid #eccfa3; border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  .rec-card { border-top: 1px dashed #e8d6b8; padding: 8px 0; }
  .rec-q { font-size: 13px; font-weight: 600; word-break: break-all; }
  .rec-tosses { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #f6ead2; color: #7a5c3a; }
  .chip.yes { background: #dcf5e3; color: #1d7a3e; }
  .chip.no  { background: #fde3e3; color: #b03434; }
  .chip.or  { background: #efe1fd; color: #7a34b0; }
  .rec-time { font-size: 10px; color: #b8a488; margin-top: 4px; }
  .empty-tip { font-size: 12px; color: #b8a488; text-align: center; padding: 10px 0; }

  /* ---------- 天空层（抛硬币时浮现） ---------- */
  #sky {
    position: fixed; inset: 0; z-index: 0; opacity: 0;
    transition: opacity .5s ease; pointer-events: none; overflow: hidden;
    background: linear-gradient(180deg, #6fbcf5 0%, #a9d9fa 55%, #e6f4ff 100%);
  }
  body.flying #sky { opacity: 1; }
  .screen { z-index: 1; }
  #sky .sun, #sky .moon { position: absolute; top: 7%; right: 10%; width: 72px; height: 72px; border-radius: 50%; }
  #sky .sun { background: radial-gradient(circle, #fff6c4 18%, #ffd54a 55%, rgba(255,213,74,0) 78%); box-shadow: 0 0 70px 24px rgba(255,220,100,.5); }
  #sky .moon { background: radial-gradient(circle at 35% 35%, #fdfbf3 55%, #d9d4c4 100%); box-shadow: 0 0 50px 14px rgba(255,255,240,.35); }
  #sky .cloud { position: absolute; background: rgba(255,255,255,.92); border-radius: 999px; filter: blur(1px); }
  #sky .cloud::before, #sky .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  #sky .cloud::before { width: 58%; height: 165%; left: 13%; top: -75%; }
  #sky .cloud::after { width: 44%; height: 130%; right: 15%; top: -52%; }
  #sky .star { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; opacity: .9; }
  #sky .rain { position: absolute; inset: 0; background: repeating-linear-gradient(105deg, rgba(255,255,255,.30) 0 1px, transparent 1px 16px); animation: rainfall .45s linear infinite; }
  @keyframes rainfall { from { background-position: 0 0; } to { background-position: -30px 80px; } }
  #sky .snowdot { position: absolute; background: #fff; border-radius: 50%; opacity: .9; animation: snowfall linear infinite; }
  @keyframes snowfall { from { transform: translateY(-8vh); } to { transform: translateY(112vh); } }
  #sky.theme-night  { background: linear-gradient(180deg, #0e1a3a 0%, #1e2f5e 55%, #3a4f86 100%); }
  #sky.theme-cloudy { background: linear-gradient(180deg, #9fb4c7 0%, #c7d5e0 60%, #eef2f6 100%); }
  #sky.theme-rain   { background: linear-gradient(180deg, #46566a 0%, #6b7c8f 60%, #97a6b4 100%); }
  #sky.theme-snow   { background: linear-gradient(180deg, #a7b6c7 0%, #d8e2ec 60%, #f4f8fb 100%); }
  #sky.theme-fog    { background: linear-gradient(180deg, #b7c2c9 0%, #d5dde2 60%, #eef1f3 100%); }

  /* ---------- 自定义两个选项 ---------- */
  #customToggle { margin-top: 10px; font-size: 12px; color: #c07b1e; cursor: pointer; text-decoration: underline dotted; user-select: none; }
  #customBox { display: none; gap: 8px; margin-top: 8px; width: min(78vw, 360px); }
  #customBox.open { display: flex; }
  #customBox input {
    flex: 1; min-width: 0; padding: 10px 12px; border: 2px solid #eccfa3; border-radius: 12px;
    background: #fffdf8; font-size: 13px; color: #4a3728; outline: none;
  }
  #customBox input:focus { border-color: #f0a832; }

  /* 六边形硬币 SVG 内部 */
  .face { pointer-events: none; }
</style>
</head>
<body>

<!-- 抛硬币时浮现的真实天空层（按当地实时天气变化） -->
<div id="sky"></div>

<!-- ============ 第一页：简介 ============ -->
<div id="screen1" class="screen active">
  <p class="intro-text">
    人生是一场由无数选择拼成的长卷。<br>
    <span class="em">yes</span> 是一种选择，<span class="em">no</span> 也是一种选择，<span class="em">or</span> 是留给命运的浪漫。<br>
    有时候，不选择，本身也是一种选择。<br>
    硬币会转，但答案，其实一直藏在你心里。
  </p>
  <p class="thanks">在此特别感谢我的朋友 <span class="veggie">🥗</span> 先生的帮助。</p>
  <button class="next-btn" onclick="goNext()">下一步</button>
</div>

<!-- ============ 第二页：抛硬币 ============ -->
<div id="screen2" class="screen">
  <div id="bubble"></div>

  <div class="stage">
    <div id="coinWrap">
      <svg id="coinSvg" viewBox="0 0 120 120">
        <defs>
          <radialGradient id="goldFace" cx="35%" cy="28%" r="85%">
            <stop offset="0%" stop-color="#fff9e0"/>
            <stop offset="42%" stop-color="#ffdd80"/>
            <stop offset="78%" stop-color="#eeb03a"/>
            <stop offset="100%" stop-color="#cf8318"/>
          </radialGradient>
          <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fbe7ac"/>
            <stop offset="50%" stop-color="#e8a92e"/>
            <stop offset="100%" stop-color="#9c6410"/>
          </linearGradient>
          <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a8641a" flood-opacity="0.45"/>
          </filter>
        </defs>
        <g filter="url(#coinGlow)">
          <!-- 外圈：立体包边 -->
          <polygon points="60,3 109,31.5 109,88.5 60,117 11,88.5 11,31.5"
                   fill="url(#goldRim)" stroke="#8a5a0c" stroke-width="2" stroke-linejoin="round"/>
          <!-- 面板：高级渐变面 -->
          <polygon points="60,10 103,35 103,85 60,110 17,85 17,35"
                   fill="url(#goldFace)" stroke="#c98a1d" stroke-width="1.2" stroke-linejoin="round"/>
          <!-- 内圈细纹 -->
          <polygon points="60,16 98,38 98,82 60,104 22,82 22,38"
                   fill="none" stroke="#fff4cd" stroke-width="1.6" stroke-linejoin="round"
                   stroke-dasharray="4 3" opacity=".85"/>
          <!-- 高光 -->
          <path d="M28 32 Q40 18 58 15" stroke="#fffdf2" stroke-width="4.5" fill="none"
                stroke-linecap="round" opacity=".85"/>
          <path d="M92 88 Q84 97 70 102" stroke="#8a5a0c" stroke-width="2.5" fill="none"
                stroke-linecap="round" opacity=".25"/>
          <!-- 闪星星 -->
          <path d="M88 30 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="#fffbe8" opacity=".95"/>
          <path d="M26 74 l1.1 2.8 2.8 1.1 -2.8 1.1 -1.1 2.8 -1.1 -2.8 -2.8 -1.1 2.8 -1.1 z" fill="#fffbe8" opacity=".8"/>
          <!-- 可爱脸 -->
          <g class="face">
            <ellipse cx="45" cy="51" rx="5.2" ry="6.6" fill="#4a2f0a"/>
            <ellipse cx="75" cy="51" rx="5.2" ry="6.6" fill="#4a2f0a"/>
            <circle cx="46.8" cy="48.6" r="2.1" fill="#fff"/>
            <circle cx="76.8" cy="48.6" r="2.1" fill="#fff"/>
            <circle cx="43.6" cy="53.6" r="1" fill="#fff" opacity=".8"/>
            <circle cx="73.6" cy="53.6" r="1" fill="#fff" opacity=".8"/>
            <path d="M40 44 q5 -3 9 -1" stroke="#4a2f0a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <path d="M70 43 q4 -2 9 1" stroke="#4a2f0a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <circle cx="35" cy="63" r="5.5" fill="#ff9d6b" opacity=".5"/>
            <circle cx="85" cy="63" r="5.5" fill="#ff9d6b" opacity=".5"/>
            <path d="M53 68 q2.5 3 5 0 q2.5 3 5 0" stroke="#4a2f0a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>
    <div id="hand">
      <svg viewBox="0 0 200 150">
        <defs>
          <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffdcb8"/>
            <stop offset="100%" stop-color="#f0b083"/>
          </linearGradient>
        </defs>
        <!-- 手掌 -->
        <path d="M55 78 Q50 58 62 50 L138 50 Q152 56 148 78 L142 108 Q120 128 96 126 Q68 122 60 104 Z"
              fill="url(#skin)" stroke="#d68f5c" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- 四根手指 -->
        <rect x="62"  y="18" width="18" height="46" rx="9"  fill="url(#skin)" stroke="#d68f5c" stroke-width="2.5"/>
        <rect x="84"  y="10" width="19" height="54" rx="9.5" fill="url(#skin)" stroke="#d68f5c" stroke-width="2.5"/>
        <rect x="107" y="12" width="19" height="52" rx="9.5" fill="url(#skin)" stroke="#d68f5c" stroke-width="2.5"/>
        <rect x="130" y="22" width="17" height="42" rx="8.5" fill="url(#skin)" stroke="#d68f5c" stroke-width="2.5"/>
        <!-- 拇指 -->
        <path d="M148 92 Q168 84 170 70 Q171 60 162 60 Q154 61 148 72 Z"
              fill="url(#skin)" stroke="#d68f5c" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- 掌纹与细节 -->
        <path d="M84 92 Q100 100 120 92" stroke="#e2a273" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M88 104 Q102 110 116 104" stroke="#e2a273" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>
        <ellipse cx="72" cy="24" rx="4" ry="6" fill="#ffe9cf"/>
        <ellipse cx="94" cy="16" rx="4" ry="6" fill="#ffe9cf"/>
        <ellipse cx="117" cy="18" rx="4" ry="6" fill="#ffe9cf"/>
        <ellipse cx="139" cy="28" rx="3.5" ry="5" fill="#ffe9cf"/>
      </svg>
    </div>
  </div>

  <div id="result"></div>
  <div id="resultTip"></div>

  <input id="questionInput" type="text" maxlength="50" placeholder="写下你的纠结，硬币给你个参考意见～" autocomplete="off">
  <button id="startBtn" onclick="startToss()">开始</button>

  <div id="customToggle" onclick="toggleCustom()">⚙️ 我有两个自己的选项（可选）</div>
  <div id="customBox">
    <input id="optA" type="text" maxlength="12" placeholder="选项 A，比如：去" autocomplete="off">
    <input id="optB" type="text" maxlength="12" placeholder="选项 B，比如：不去" autocomplete="off">
  </div>

  <div class="privacy-note">🔒 记录只存在你自己的设备上 · 🌍 定位仅用于查询天气，不会保存</div>

  <div id="historyPanel">
    <h3>📜 我的抉择记录 <button id="clearBtn" onclick="clearRecords()">清空</button></h3>
    <div id="historyList"></div>
  </div>
</div>

<script>
/* ================= 页面切换 ================= */
function goNext() {
  document.getElementById('screen1').classList.remove('active');
  document.getElementById('screen2').classList.add('active');
  initSky();
  renderHistory();
}

/* ================= 音效（Web Audio 合成，无需外部文件） ================= */
let ac = null, _noise = null;
function ensureAudio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  if (!_noise) {
    _noise = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = _noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
}
function whoosh(up) { // 抛出 / 落下的风声
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = _noise; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(up ? 280 : 1400, t);
  f.frequency.exponentialRampToValueAtTime(up ? 1500 : 260, t + 0.3);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.07);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t); src.stop(t + 0.4);
}
function flipTick(delay, pitch) { // 翻转的金属嗒嗒声
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = pitch;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.06);
}
function thud() { // 手接住的闷响
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(65, t + 0.18);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.3);
}

/* ================= 概率：47.5% / 47.5% / 5%  + 每10次保底1~2次or ================= */
function rollResult(history) {
  const last9 = history.slice(-9);
  const orIn9 = last9.filter(x => x.r === 'or').length;
  if (orIn9 === 0) return 'or';                       // 保底：近10次内必出至少1次 or
  if (orIn9 >= 2 && last9.length === 9) {             // 封顶：近10次内最多2次 or
    return Math.random() < 0.5 ? 'yes' : 'no';
  }
  const r = Math.random();
  return r < 0.475 ? 'yes' : (r < 0.95 ? 'no' : 'or');
}

/* ================= 记录（localStorage，仅本设备） ================= */
const KEY = 'hexcoin_records_v1';
function loadRecords() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function saveRecords(rs) { localStorage.setItem(KEY, JSON.stringify(rs)); }

function appendToss(qText, result, label) {
  const rs = loadRecords();
  let rec = rs.find(r => r.q === qText);
  if (!rec) { rec = { q: qText, tosses: [], time: Date.now() }; rs.unshift(rec); }
  rec.tosses.push({ r: result, label: label || '', t: Date.now() });
  saveRecords(rs);
  return rec;
}
function clearRecords() {
  if (confirm('确定要清空本机上的全部记录吗？')) { saveRecords([]); renderHistory(); }
}
function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderHistory() {
  const list = document.getElementById('historyList');
  const rs = loadRecords();
  if (!rs.length) { list.innerHTML = '<div class="empty-tip">还没有记录，抛第一枚硬币吧～</div>'; return; }
  list.innerHTML = rs.map(rec => `
    <div class="rec-card">
      <div class="rec-q">❓ ${escapeHtml(rec.q)}</div>
      <div class="rec-tosses">
        ${rec.tosses.map((t, i) => `<span class="chip ${t.r}">第${i + 1}次 · ${escapeHtml(t.label || t.r.toUpperCase())}</span>`).join('')}
      </div>
      <div class="rec-time">共 ${rec.tosses.length} 次抛掷 · 最近 ${fmtTime(rec.tosses[rec.tosses.length - 1].t)}</div>
    </div>`).join('');
}
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ================= 气泡与台词 ================= */
const bubbleEl = document.getElementById('bubble');
let bubbleTimer = null;
function bubble(msg, keep) {
  bubbleEl.textContent = msg;
  bubbleEl.classList.add('show');
  clearTimeout(bubbleTimer);
  if (!keep) bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), 2600);
}

const wittyStart = [
  '别眨眼，命运要出手了！',
  '问题收到，硬币已就位～',
  '我转的可不是硬币，是你的命运（bushi）',
  '抛之前，心里默念三遍你想要的那个答案 😉',
  '加油啊硬币，全靠你了！',
];
const dizzyMsg = '不要再抛啦，我要摇晕啦，就选择它吧！🤪';

/* 结果提示语（支持自定义选项文字） */
const tipFns = {
  yes: L => `命运点头：选「${L.yes}」不会有错 ✨`,
  no:  L => `命运摇头：放下「${L.no}」，前方有更好的在等你 🍃`,
  or:  L => `命运摊手：都要，或者都不要——这个参考意见够大胆吧 😏`,
};

/* 自定义两个选项 */
function toggleCustom() {
  document.getElementById('customBox').classList.toggle('open');
}
function getLabels() {
  const a = document.getElementById('optA').value.trim();
  const b = document.getElementById('optB').value.trim();
  return (a && b) ? { yes: a, no: b, or: '都要/都不要' } : { yes: 'YES', no: 'NO', or: 'OR' };
}

/* ================= 真实天空：定位 → Open-Meteo 免费天气 → 换肤 ================= */
const skyEl = document.getElementById('sky');
let weatherName = '好天气 🌤️';

function themeFor(code, isDay) {
  if (code <= 1) return isDay ? 'clear-day' : 'night';
  if (code <= 3) return 'cloudy';
  if (code >= 45 && code <= 48) return 'fog';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return 'rain';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  return isDay ? 'clear-day' : 'night';
}
function decorate(theme) {
  skyEl.innerHTML = '';
  const mk = (cls, style) => {
    const d = document.createElement('div');
    d.className = cls;
    Object.assign(d.style, style);
    skyEl.appendChild(d);
    return d;
  };
  if (theme === 'clear-day') {
    mk('sun', {});
    mk('cloud', { width: '160px', height: '44px', top: '18%', left: '12%' });
    mk('cloud', { width: '110px', height: '34px', top: '32%', right: '18%' });
  } else if (theme === 'night') {
    mk('moon', {});
    for (let i = 0; i < 16; i++) {
      mk('star', { top: Math.random() * 55 + '%', left: Math.random() * 95 + '%',
                   transform: `scale(${0.6 + Math.random()})` });
    }
  } else if (theme === 'cloudy' || theme === 'rain' || theme === 'snow') {
    mk('cloud', { width: '190px', height: '52px', top: '12%', left: '10%' });
    mk('cloud', { width: '140px', height: '40px', top: '26%', right: '14%' });
    mk('cloud', { width: '100px', height: '30px', top: '40%', left: '45%', opacity: .7 });
    if (theme === 'rain') mk('rain', {});
    if (theme === 'snow') {
      for (let i = 0; i < 18; i++) {
        const s = 3 + Math.random() * 5;
        mk('snowdot', { width: s + 'px', height: s + 'px', left: Math.random() * 98 + '%',
                        top: '-5vh', animationDuration: 5 + Math.random() * 6 + 's',
                        animationDelay: -Math.random() * 8 + 's' });
      }
    }
  }
  /* fog / default：留白即可 */
}
function applySky(theme, name) {
  skyEl.className = theme === 'night' ? 'theme-night' : 'theme-' + theme;
  decorate(theme);
  weatherName = name;
}
function initSky() {
  const fallback = () => applySky('clear-day', '好天气 🌤️');
  if (!navigator.geolocation) { fallback(); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=weather_code,is_day`;
    fetch(url).then(r => r.json()).then(d => {
      const code = d.current.weather_code, isDay = d.current.is_day === 1;
      const theme = themeFor(code, isDay);
      const names = {
        'clear-day': '晴朗天空 ☀️', 'night': '静谧夜空 🌙', 'cloudy': '多云天空 ☁️',
        'fog': '薄雾弥漫 🌫️', 'rain': '落雨天空 🌧️', 'snow': '飘雪天空 ❄️',
      };
      applySky(theme, names[theme] || '此刻的天空');
    }).catch(fallback);
  }, fallback, { timeout: 6000 });
}

/* ================= 抛掷主流程 ================= */
const coinWrap = document.getElementById('coinWrap');
const hand = document.getElementById('hand');
const resultEl = document.getElementById('result');
const tipEl = document.getElementById('resultTip');
const startBtn = document.getElementById('startBtn');
const input = document.getElementById('questionInput');
let tossing = false;

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startToss() {
  const qText = input.value.trim();
  if (!qText) { bubble('先写下你的纠结吧 ✍️'); input.focus(); return; }
  const a = document.getElementById('optA').value.trim();
  const b = document.getElementById('optB').value.trim();
  if ((a && !b) || (!a && b)) { bubble('两个选项要么都填，要么都不填哦 🙃'); return; }
  if (tossing) return;
  tossing = true; startBtn.disabled = true;
  ensureAudio();

  resultEl.classList.remove('show'); tipEl.textContent = '';
  bubble(wittyStart[Math.floor(Math.random() * wittyStart.length)]);
  await wait(900);

  // 抛出：天空浮现，手把硬币送上天
  document.body.classList.add('flying');
  bubble(`${weatherName}，正适合做决定 ✨`);
  hand.classList.add('flick');
  whoosh(true);
  coinWrap.classList.add('tossing');
  coinWrap.classList.add('spinning');
  // 翻转音效：快→慢的嗒嗒声
  let delay = 0;
  for (let i = 0; i < 10; i++) {
    flipTick(delay, 900 + Math.random() * 500);
    delay += 0.07 + i * 0.012;
  }
  await wait(950);
  whoosh(false); // 落回来的风声
  await wait(210);

  // 接住
  coinWrap.classList.remove('tossing');
  coinWrap.classList.remove('spinning');
  hand.classList.remove('flick');
  thud();
  setTimeout(() => document.body.classList.remove('flying'), 700);

  const rs = loadRecords();
  const prev = rs.find(r => r.q === qText);
  const result = rollResult(prev ? prev.tosses : []);
  const labels = getLabels();
  const rec = appendToss(qText, result, labels[result]);

  // 结果展示
  const colors = { yes: '#1d9d4c', no: '#d64545', or: '#8a3ec9' };
  resultEl.textContent = labels[result];
  resultEl.style.color = colors[result];
  resultEl.classList.add('show');
  tipEl.textContent = tipFns[result](labels);

  // 连续3次相同 → 硬币抗议
  const t = rec.tosses;
  if (t.length >= 3 && t.slice(-3).every(x => x.r === result)) {
    setTimeout(() => bubble(dizzyMsg, true), 700);
  }

  renderHistory();
  tossing = false; startBtn.disabled = false;
}
</script>
